name: Save Tool to Vault

on:
  repository_dispatch:
    types: [save-to-vault]

jobs:
  save:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout vault repo
        uses: actions/checkout@v4

      - name: Create note file
        run: |
          mkdir -p Tools
          cat << 'NOTEEOF' > "${{ github.event.client_payload.filename }}"
          ${{ github.event.client_payload.content }}
          NOTEEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add tool note from Telegram"
          git push
