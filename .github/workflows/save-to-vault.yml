name: Save Tool to Vault

on:
  repository_dispatch:
    types: [save-to-vault]

jobs:
  save:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout vault repo
        uses: actions/checkout@v4

      - name: Create note file
        run: |
          python3 << 'PYEOF'
          import json, os, re

          filename = "${{ github.event.client_payload.filename }}"
          content = "${{ github.event.client_payload.content }}"

          # Tạo thư mục nếu chưa có
          os.makedirs(os.path.dirname(filename), exist_ok=True)

          with open(filename, "w", encoding="utf-8") as f:
              f.write(content)

          print(f"Created: {filename}")
          PYEOF

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "feat: add tool note from Telegram"
          git push
